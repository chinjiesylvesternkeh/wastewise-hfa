<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wellness Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .test-credentials {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .test-credentials h4 {
            margin-bottom: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Welcome Back</h1>
            <p>Sign in to your wellness account</p>
        </div>

        <div class="test-credentials">
            <h4>Test Credentials Available:</h4>
            <p><strong>Email:</strong> authtest@example.com</p>
            <p><strong>Password:</strong> testpassword123</p>
            <small>Or use any account you registered</small>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn" id="login-btn">
                Sign In
            </button>
        </form>

        <div id="result" class="result"></div>

        <div class="register-link">
            <p>Don't have an account? <a href="/simple-register.html">Register here</a></p>
        </div>
    </div>

    <script>
        console.log('Simple login page loaded');

        const form = document.getElementById('login-form');
        const button = document.getElementById('login-btn');
        const result = document.getElementById('result');

        // Load remembered user data
        function loadRememberedData() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            const rememberedName = localStorage.getItem('rememberedName');
            
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                console.log('Auto-filled email:', rememberedEmail);
                
                // Update welcome message if we have the name
                if (rememberedName) {
                    const header = document.querySelector('.header p');
                    header.textContent = `Welcome back, ${rememberedName}!`;
                }
                
                // Focus on password field since email is already filled
                document.getElementById('password').focus();
            }
        }

        // Call on page load
        loadRememberedData();

        // Form submission handler
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            console.log('Login form submitted');

            // Get form data
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            console.log('Login attempt:', { email, password: password ? '[PROVIDED]' : '[EMPTY]' });

            // Validate required fields
            if (!email || !password) {
                showResult('Please fill in both email and password', 'error');
                return;
            }

            // Show loading state
            button.disabled = true;
            button.textContent = 'Signing In...';
            showResult('Signing you in...', 'info');

            try {
                // Submit login
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Login response status:', response.status);
                const data = await response.json();
                console.log('Login response data:', data);

                if (response.ok) {
                    // Success!
                    showResult(`🎉 Welcome back, ${data.user.name}!`, 'success');
                    
                    // Store auth data
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Update remembered data with latest login
                    localStorage.setItem('rememberedEmail', email);
                    localStorage.setItem('rememberedName', data.user.name);
                    
                    // Redirect to main app after 1 second
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                    
                } else {
                    // Error from server
                    showResult(`Login failed: ${data.error}`, 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showResult(`Network error: ${error.message}`, 'error');
            } finally {
                // Reset button
                button.disabled = false;
                button.textContent = 'Sign In';
            }
        });

        function showResult(message, type) {
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }

        // Add "Remember Me" functionality
        function addRememberMeOption() {
            const passwordGroup = document.querySelector('.form-group:last-of-type');
            const rememberDiv = document.createElement('div');
            rememberDiv.style.marginTop = '10px';
            rememberDiv.innerHTML = `
                <label style="display: flex; align-items: center; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" id="remember-me" style="margin-right: 8px; width: auto;">
                    Remember my email for next time
                </label>
            `;
            passwordGroup.appendChild(rememberDiv);
            
            // Check if we should pre-check the remember me option
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('remember-me').checked = true;
            }
        }

        // Add remember me option
        addRememberMeOption();

        console.log('Login page ready');
    </script>
</body>
</html>
