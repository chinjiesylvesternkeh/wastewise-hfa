<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 300px; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background: #f8f9fa; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Debug Registration Form</h1>
    
    <form id="register-form">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="register-name" value="Debug User" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="register-email" value="debug@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="register-password" value="debugpassword123" required>
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="register-dob" value="1990-01-01">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="register-gender">
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other" selected>Other</option>
                <option value="prefer_not_to_say">Prefer not to say</option>
            </select>
        </div>
        <button type="submit">Register</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        console.log('Debug page loaded');
        
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Form submitted');
            
            const formData = {
                name: document.getElementById('register-name').value,
                email: document.getElementById('register-email').value,
                password: document.getElementById('register-password').value,
                dateOfBirth: document.getElementById('register-dob').value,
                gender: document.getElementById('register-gender').value
            };

            console.log('Form data:', formData);

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Submitting...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3>✅ Registration Successful!</h3>
                        <p><strong>User:</strong> ${data.user.name}</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Registration Failed</h3>
                        <p><strong>Error:</strong> ${data.error}</p>
                    `;
                }
            } catch (error) {
                console.error('Registration error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Network Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
