<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration</h1>
    <form id="test-form">
        <div>
            <label>Name:</label>
            <input type="text" id="name" value="Test User" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="test2@example.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="testpassword123" required>
        </div>
        <button type="submit">Register</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('test-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            console.log('Submitting:', formData);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                console.log('Response:', data);

                document.getElementById('result').innerHTML = 
                    `<h3>Result:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;

                if (response.ok) {
                    alert('Registration successful!');
                } else {
                    alert('Registration failed: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 
                    `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        });
    </script>
</body>
</html>
