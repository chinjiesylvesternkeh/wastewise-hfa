<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Integrated Wellness Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .remember-me input {
            width: auto;
            margin-right: 8px;
        }

        .remember-me label {
            font-weight: normal;
            cursor: pointer;
            margin-bottom: 0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e1e5e9;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .welcome-message {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #0066cc;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to Home</a>
    
    <div class="container">
        <div class="header">
            <h1>🌟 Welcome Back</h1>
            <p id="header-subtitle">Sign in to your wellness account</p>
        </div>

        <div id="welcome-message" class="welcome-message" style="display: none;">
            <!-- Welcome message will be inserted here -->
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Remember my email for next time</label>
            </div>

            <button type="submit" class="btn" id="login-btn">
                Sign In
            </button>
        </form>

        <div id="result" class="result"></div>

        <div class="register-link">
            <p>Don't have an account? <a href="/register">Join here</a></p>
        </div>
    </div>

    <script>
        console.log('Login page loaded');

        const form = document.getElementById('login-form');
        const button = document.getElementById('login-btn');
        const result = document.getElementById('result');

        // Load remembered user data
        function loadRememberedData() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            const rememberedName = localStorage.getItem('rememberedName');
            
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                console.log('Auto-filled email:', rememberedEmail);
                
                // Update welcome message if we have the name
                if (rememberedName) {
                    const welcomeMessage = document.getElementById('welcome-message');
                    const headerSubtitle = document.getElementById('header-subtitle');
                    
                    welcomeMessage.innerHTML = `Welcome back, ${rememberedName}! 👋`;
                    welcomeMessage.style.display = 'block';
                    headerSubtitle.textContent = 'Continue your wellness journey';
                }
                
                // Focus on password field since email is already filled
                document.getElementById('password').focus();
                
                // Check remember me checkbox
                document.getElementById('remember-me').checked = true;
            }
        }

        // Form submission handler
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            console.log('Login form submitted');

            // Get form data
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            console.log('Login attempt:', { email, password: password ? '[PROVIDED]' : '[EMPTY]', rememberMe });

            // Validate required fields
            if (!email || !password) {
                showResult('Please fill in both email and password', 'error');
                return;
            }

            // Show loading state
            button.disabled = true;
            button.textContent = 'Signing In...';
            showResult('Signing you in...', 'info');

            try {
                // Submit login
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Login response status:', response.status);
                const data = await response.json();
                console.log('Login response data:', data);

                if (response.ok) {
                    // Success!
                    showResult(`🎉 Welcome back, ${data.user.name}!`, 'success');
                    
                    // Store auth data
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Update remembered data if remember me is checked
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                        localStorage.setItem('rememberedName', data.user.name);
                    } else {
                        // Clear remembered data if user unchecked remember me
                        localStorage.removeItem('rememberedEmail');
                        localStorage.removeItem('rememberedName');
                    }
                    
                    // Redirect to dashboard after 1 second
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                    
                } else {
                    // Error from server
                    showResult(`Login failed: ${data.error}`, 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showResult(`Network error: ${error.message}`, 'error');
            } finally {
                // Reset button
                button.disabled = false;
                button.textContent = 'Sign In';
            }
        });

        function showResult(message, type) {
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }

        // Call on page load
        loadRememberedData();

        console.log('Login page ready');
    </script>
</body>
</html>
