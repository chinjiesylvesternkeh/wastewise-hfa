<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Wellness Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .auth-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .dashboard {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #dc3545;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e5e9;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            background: #f8f9fa;
            margin-right: 5px;
            border-radius: 5px 5px 0 0;
            font-weight: 500;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: 600;
            background: white;
        }

        .tab:hover {
            background: #e9ecef;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .metric-item, .activity-item, .meal-item {
            padding: 15px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
        }

        .notification.error {
            background: #dc3545;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
            
            .auth-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Wellness Platform</h1>
            <p>Your integrated healthcare, fitness, and nutrition companion</p>
        </div>

        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login', event)">Login</div>
                <div class="tab" onclick="switchTab('register', event)">Register</div>
            </div>

            <!-- Login Form -->
            <div id="login-tab" class="tab-content active">
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-tab" class="tab-content">
                <form id="register-form">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="register-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="register-dob">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="register-gender">
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Register</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="dashboard">
            <!-- Health Card -->
            <div class="card">
                <h3>🏥 Health Tracking</h3>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="health-metrics-count">0</div>
                        <div class="stat-label">Metrics Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="appointments-count">0</div>
                        <div class="stat-label">Upcoming</div>
                    </div>
                </div>
                
                <form id="health-metric-form">
                    <div class="form-group">
                        <label>Metric Type</label>
                        <select id="metric-type" required>
                            <option value="weight">Weight (kg)</option>
                            <option value="blood_pressure_systolic">Blood Pressure Systolic</option>
                            <option value="heart_rate">Heart Rate (bpm)</option>
                            <option value="blood_glucose">Blood Glucose</option>
                            <option value="temperature">Temperature (°C)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Value</label>
                        <input type="number" id="metric-value" step="0.1" required>
                    </div>
                    <button type="submit" class="btn">Record Metric</button>
                </form>

                <div id="recent-metrics"></div>
            </div>

            <!-- Fitness Card -->
            <div class="card">
                <h3>💪 Fitness Tracking</h3>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="activities-count">0</div>
                        <div class="stat-label">Activities Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="calories-burned">0</div>
                        <div class="stat-label">Calories Burned</div>
                    </div>
                </div>

                <form id="activity-form">
                    <div class="form-group">
                        <label>Activity Type</label>
                        <select id="activity-type" required>
                            <option value="walking">Walking</option>
                            <option value="running">Running</option>
                            <option value="cycling">Cycling</option>
                            <option value="swimming">Swimming</option>
                            <option value="weightlifting">Weightlifting</option>
                            <option value="yoga">Yoga</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input type="number" id="activity-duration" required>
                    </div>
                    <div class="form-group">
                        <label>Calories Burned</label>
                        <input type="number" id="activity-calories">
                    </div>
                    <button type="submit" class="btn">Log Activity</button>
                </form>

                <div id="recent-activities"></div>
            </div>

            <!-- Nutrition Card -->
            <div class="card">
                <h3>🍎 Nutrition Tracking</h3>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="daily-calories">0</div>
                        <div class="stat-label">Calories Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="meals-logged">0</div>
                        <div class="stat-label">Meals Logged</div>
                    </div>
                </div>

                <form id="nutrition-form">
                    <div class="form-group">
                        <label>Food Item</label>
                        <input type="text" id="food-item" required>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="food-quantity" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <select id="food-unit" required>
                            <option value="grams">Grams</option>
                            <option value="cups">Cups</option>
                            <option value="pieces">Pieces</option>
                            <option value="servings">Servings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Meal Type</label>
                        <select id="meal-type" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" id="food-calories" required>
                    </div>
                    <button type="submit" class="btn">Log Food</button>
                </form>

                <div id="recent-nutrition"></div>
            </div>
        </div>

        <!-- User Info -->
        <div id="user-info" style="display: none; text-align: center; margin-top: 20px;">
            <span id="user-name" style="color: white; margin-right: 20px;"></span>
            <button onclick="logout()" class="btn btn-secondary">Logout</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>
