<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary & Nutrition Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #4ecdc4;
            margin-bottom: 15px;
        }

        .stat-card {
            text-align: center;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e5e9;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
        }

        .tab.active {
            border-bottom-color: #4ecdc4;
            color: #4ecdc4;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .recipe-list, .nutrition-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .recipe-item, .nutrition-item {
            padding: 15px;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recipe-item:hover, .nutrition-item:hover {
            background: #f8f9fa;
        }

        .ingredient-inputs, .instruction-inputs {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        .notification.error {
            background: #f44336;
        }

        .recipe-card {
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }

        .difficulty-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .difficulty-easy { background: #d4edda; color: #155724; }
        .difficulty-medium { background: #fff3cd; color: #856404; }
        .difficulty-hard { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍽️ Culinary & Nutrition Manager</h1>
        <p>Manage Recipes, Meal Plans & Nutrition</p>
    </div>

    <div class="container">
        <!-- Dashboard Stats -->
        <div class="dashboard" id="dashboard">
            <div class="card stat-card">
                <h3>Total Users</h3>
                <div class="stat-number" id="total-users">0</div>
            </div>
            <div class="card stat-card">
                <h3>Total Recipes</h3>
                <div class="stat-number" id="total-recipes">0</div>
            </div>
            <div class="card stat-card">
                <h3>Meal Plans</h3>
                <div class="stat-number" id="total-meal-plans">0</div>
            </div>
            <div class="card stat-card">
                <h3>Today's Entries</h3>
                <div class="stat-number" id="today-entries">0</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('recipes')">Recipes</div>
            <div class="tab" onclick="switchTab('nutrition')">Nutrition Tracking</div>
            <div class="tab" onclick="switchTab('meal-plans')">Meal Plans</div>
            <div class="tab" onclick="switchTab('users')">Users</div>
        </div>

        <!-- Recipes Tab -->
        <div id="recipes-tab" class="tab-content active">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Add New Recipe</h3>
                    <form id="recipe-form">
                        <div class="form-group">
                            <label>Recipe Name</label>
                            <input type="text" id="recipe-name" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="recipe-description" rows="2"></textarea>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label>Prep Time (min)</label>
                                <input type="number" id="recipe-prep-time">
                            </div>
                            <div class="form-group">
                                <label>Cook Time (min)</label>
                                <input type="number" id="recipe-cook-time">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label>Servings</label>
                                <input type="number" id="recipe-servings" required>
                            </div>
                            <div class="form-group">
                                <label>Difficulty</label>
                                <select id="recipe-difficulty">
                                    <option value="easy">Easy</option>
                                    <option value="medium">Medium</option>
                                    <option value="hard">Hard</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Cuisine</label>
                                <input type="text" id="recipe-cuisine" placeholder="e.g., Italian">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Ingredients</label>
                            <div id="ingredients-container">
                                <div class="ingredient-inputs">
                                    <input type="text" placeholder="Ingredient name" class="ingredient-name">
                                    <input type="number" placeholder="Quantity" class="ingredient-quantity" step="0.1">
                                    <input type="text" placeholder="Unit" class="ingredient-unit">
                                    <button type="button" class="btn btn-small" onclick="addIngredientRow()">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Instructions</label>
                            <div id="instructions-container">
                                <div class="instruction-inputs">
                                    <textarea placeholder="Step 1 instructions" class="instruction-text" rows="2"></textarea>
                                    <input type="number" placeholder="Duration (min)" class="instruction-duration">
                                    <input type="number" placeholder="Temperature" class="instruction-temp">
                                    <button type="button" class="btn btn-small" onclick="addInstructionRow()">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Nutrition Info (per serving)</label>
                            <div class="nutrition-grid">
                                <input type="number" id="recipe-calories" placeholder="Calories">
                                <input type="number" id="recipe-protein" placeholder="Protein (g)" step="0.1">
                                <input type="number" id="recipe-carbs" placeholder="Carbs (g)" step="0.1">
                                <input type="number" id="recipe-fat" placeholder="Fat (g)" step="0.1">
                            </div>
                        </div>

                        <button type="submit" class="btn">Add Recipe</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Recent Recipes</h3>
                    <div class="recipe-list" id="recipe-list">
                        <!-- Recipes will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Nutrition Tracking Tab -->
        <div id="nutrition-tab" class="tab-content">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Log Nutrition</h3>
                    <form id="nutrition-form">
                        <div class="form-group">
                            <label>User</label>
                            <select id="nutrition-user" required>
                                <option value="">Select User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="nutrition-date" required>
                        </div>
                        <div class="form-group">
                            <label>Meal Type</label>
                            <select id="nutrition-meal-type" required>
                                <option value="">Select Meal</option>
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                                <option value="snack">Snack</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Food Item</label>
                            <input type="text" id="nutrition-food" required placeholder="e.g., Grilled Chicken">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" id="nutrition-quantity" required step="0.1">
                            </div>
                            <div class="form-group">
                                <label>Unit</label>
                                <input type="text" id="nutrition-unit" placeholder="g, cups, pieces">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nutrition Facts</label>
                            <div class="nutrition-grid">
                                <input type="number" id="nutrition-calories" placeholder="Calories" required>
                                <input type="number" id="nutrition-protein" placeholder="Protein (g)" step="0.1">
                                <input type="number" id="nutrition-carbs" placeholder="Carbs (g)" step="0.1">
                                <input type="number" id="nutrition-fat" placeholder="Fat (g)" step="0.1">
                            </div>
                        </div>
                        <button type="submit" class="btn">Log Food</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Recent Nutrition Entries</h3>
                    <div class="nutrition-list" id="nutrition-list">
                        <!-- Nutrition entries will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Meal Plans Tab -->
        <div id="meal-plans-tab" class="tab-content">
            <div class="card">
                <h3>Create Meal Plan</h3>
                <form id="meal-plan-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>User</label>
                            <select id="meal-plan-user" required>
                                <option value="">Select User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Plan Name</label>
                            <input type="text" id="meal-plan-name" required placeholder="e.g., Weekly Plan">
                        </div>
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="meal-plan-start" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Create Meal Plan</button>
                </form>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="users-tab" class="tab-content">
            <div class="card">
                <h3>Add New User</h3>
                <form id="user-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="user-name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="user-email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dietary Restrictions</label>
                        <input type="text" id="user-restrictions" placeholder="e.g., vegetarian, gluten-free (comma separated)">
                    </div>
                    <div class="form-group">
                        <label>Allergies</label>
                        <input type="text" id="user-allergies" placeholder="e.g., nuts, dairy (comma separated)">
                    </div>
                    <div class="form-group">
                        <label>Daily Nutrition Goals</label>
                        <div class="nutrition-grid">
                            <input type="number" id="user-calories" placeholder="Daily Calories">
                            <input type="number" id="user-protein" placeholder="Protein (g)" step="0.1">
                            <input type="number" id="user-carbs" placeholder="Carbs (g)" step="0.1">
                            <input type="number" id="user-fat" placeholder="Fat (g)" step="0.1">
                        </div>
                    </div>
                    <button type="submit" class="btn">Add User</button>
                </form>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Global variables
        let users = [];
        let recipes = [];
        let nutritionEntries = [];

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            loadUsers();
            loadRecipes();
            loadNutritionEntries();
            setupEventListeners();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('nutrition-date').value = today;
            document.getElementById('meal-plan-start').value = today;
        });

        function setupEventListeners() {
            document.getElementById('recipe-form').addEventListener('submit', addRecipe);
            document.getElementById('nutrition-form').addEventListener('submit', addNutritionEntry);
            document.getElementById('meal-plan-form').addEventListener('submit', addMealPlan);
            document.getElementById('user-form').addEventListener('submit', addUser);
        }

        function switchTab(tabName) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab and content
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        function addIngredientRow() {
            const container = document.getElementById('ingredients-container');
            const newRow = document.createElement('div');
            newRow.className = 'ingredient-inputs';
            newRow.innerHTML = `
                <input type="text" placeholder="Ingredient name" class="ingredient-name">
                <input type="number" placeholder="Quantity" class="ingredient-quantity" step="0.1">
                <input type="text" placeholder="Unit" class="ingredient-unit">
                <button type="button" class="btn btn-small" onclick="removeRow(this)">-</button>
            `;
            container.appendChild(newRow);
        }

        function addInstructionRow() {
            const container = document.getElementById('instructions-container');
            const newRow = document.createElement('div');
            newRow.className = 'instruction-inputs';
            newRow.innerHTML = `
                <textarea placeholder="Step instructions" class="instruction-text" rows="2"></textarea>
                <input type="number" placeholder="Duration (min)" class="instruction-duration">
                <input type="number" placeholder="Temperature" class="instruction-temp">
                <button type="button" class="btn btn-small" onclick="removeRow(this)">-</button>
            `;
            container.appendChild(newRow);
        }

        function removeRow(button) {
            button.parentElement.remove();
        }

        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                document.getElementById('total-users').textContent = data.totalUsers;
                document.getElementById('total-recipes').textContent = data.totalRecipes;
                document.getElementById('total-meal-plans').textContent = data.totalMealPlans;
                document.getElementById('today-entries').textContent = data.todayEntries;
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                users = await response.json();
                populateUserSelects();
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function populateUserSelects() {
            const selects = ['nutrition-user', 'meal-plan-user'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = '<option value="">Select User</option>';
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user._id;
                    option.textContent = user.name;
                    select.appendChild(option);
                });
            });
        }

        async function loadRecipes() {
            try {
                const response = await fetch('/api/recipes');
                recipes = await response.json();
                displayRecipes();
            } catch (error) {
                console.error('Error loading recipes:', error);
            }
        }

        function displayRecipes() {
            const recipeList = document.getElementById('recipe-list');
            recipeList.innerHTML = '';
            
            recipes.slice(0, 10).forEach(recipe => {
                const recipeItem = document.createElement('div');
                recipeItem.className = 'recipe-card';
                recipeItem.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <strong>${recipe.name}</strong>
                            <span class="difficulty-badge difficulty-${recipe.difficulty}">${recipe.difficulty}</span>
                        </div>
                        <div style="text-align: right; font-size: 14px; color: #666;">
                            ${recipe.nutritionInfo?.calories || 0} cal
                        </div>
                    </div>
                    <div class="recipe-meta">
                        <span>🍽️ ${recipe.servings} servings</span>
                        <span>⏱️ ${(recipe.prepTime || 0) + (recipe.cookTime || 0)} min</span>
                        ${recipe.cuisine ? `<span>🌍 ${recipe.cuisine}</span>` : ''}
                    </div>
                    <p style="font-size: 14px; color: #666; margin-top: 8px;">${recipe.description || 'No description'}</p>
                `;
                recipeList.appendChild(recipeItem);
            });
        }

        async function addRecipe(e) {
            e.preventDefault();
            
            // Collect ingredients
            const ingredientRows = document.querySelectorAll('.ingredient-inputs');
            const ingredients = [];
            ingredientRows.forEach(row => {
                const name = row.querySelector('.ingredient-name').value;
                const quantity = parseFloat(row.querySelector('.ingredient-quantity').value);
                const unit = row.querySelector('.ingredient-unit').value;
                if (name && quantity && unit) {
                    ingredients.push({ name, quantity, unit });
                }
            });

            // Collect instructions
            const instructionRows = document.querySelectorAll('.instruction-inputs');
            const instructions = [];
            instructionRows.forEach((row, index) => {
                const instruction = row.querySelector('.instruction-text').value;
                const duration = parseInt(row.querySelector('.instruction-duration').value) || null;
                const temperature = parseInt(row.querySelector('.instruction-temp').value) || null;
                if (instruction) {
                    instructions.push({ step: index + 1, instruction, duration, temperature });
                }
            });

            const recipeData = {
                name: document.getElementById('recipe-name').value,
                description: document.getElementById('recipe-description').value,
                prepTime: parseInt(document.getElementById('recipe-prep-time').value) || null,
                cookTime: parseInt(document.getElementById('recipe-cook-time').value) || null,
                servings: parseInt(document.getElementById('recipe-servings').value),
                difficulty: document.getElementById('recipe-difficulty').value,
                cuisine: document.getElementById('recipe-cuisine').value,
                ingredients,
                instructions,
                nutritionInfo: {
                    calories: parseInt(document.getElementById('recipe-calories').value) || null,
                    protein: parseFloat(document.getElementById('recipe-protein').value) || null,
                    carbs: parseFloat(document.getElementById('recipe-carbs').value) || null,
                    fat: parseFloat(document.getElementById('recipe-fat').value) || null
                }
            };

            try {
                const response = await fetch('/api/recipes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recipeData)
                });

                if (response.ok) {
                    showNotification('Recipe added successfully!');
                    document.getElementById('recipe-form').reset();
                    // Reset ingredient and instruction containers
                    document.getElementById('ingredients-container').innerHTML = `
                        <div class="ingredient-inputs">
                            <input type="text" placeholder="Ingredient name" class="ingredient-name">
                            <input type="number" placeholder="Quantity" class="ingredient-quantity" step="0.1">
                            <input type="text" placeholder="Unit" class="ingredient-unit">
                            <button type="button" class="btn btn-small" onclick="addIngredientRow()">+</button>
                        </div>
                    `;
                    document.getElementById('instructions-container').innerHTML = `
                        <div class="instruction-inputs">
                            <textarea placeholder="Step 1 instructions" class="instruction-text" rows="2"></textarea>
                            <input type="number" placeholder="Duration (min)" class="instruction-duration">
                            <input type="number" placeholder="Temperature" class="instruction-temp">
                            <button type="button" class="btn btn-small" onclick="addInstructionRow()">+</button>
                        </div>
                    `;
                    loadRecipes();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding recipe', 'error');
            }
        }

        async function loadNutritionEntries() {
            try {
                const response = await fetch('/api/nutrition');
                nutritionEntries = await response.json();
                displayNutritionEntries();
            } catch (error) {
                console.error('Error loading nutrition entries:', error);
            }
        }

        function displayNutritionEntries() {
            const nutritionList = document.getElementById('nutrition-list');
            nutritionList.innerHTML = '';
            
            nutritionEntries.slice(0, 10).forEach(entry => {
                const entryItem = document.createElement('div');
                entryItem.className = 'nutrition-item';
                entryItem.innerHTML = `
                    <div>
                        <strong>${entry.userId?.name || 'Unknown User'}</strong><br>
                        <small>${entry.totalNutrition.calories} calories • ${entry.meals.length} meals</small>
                    </div>
                    <div>
                        <small>${new Date(entry.date).toLocaleDateString()}</small>
                    </div>
                `;
                nutritionList.appendChild(entryItem);
            });
        }

        async function addNutritionEntry(e) {
            e.preventDefault();
            
            const nutritionData = {
                userId: document.getElementById('nutrition-user').value,
                date: document.getElementById('nutrition-date').value,
                meals: [{
                    mealType: document.getElementById('nutrition-meal-type').value,
                    foods: [{
                        name: document.getElementById('nutrition-food').value,
                        quantity: parseFloat(document.getElementById('nutrition-quantity').value),
                        unit: document.getElementById('nutrition-unit').value,
                        calories: parseInt(document.getElementById('nutrition-calories').value),
                        protein: parseFloat(document.getElementById('nutrition-protein').value) || 0,
                        carbs: parseFloat(document.getElementById('nutrition-carbs').value) || 0,
                        fat: parseFloat(document.getElementById('nutrition-fat').value) || 0
                    }]
                }]
            };

            try {
                const response = await fetch('/api/nutrition', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nutritionData)
                });

                if (response.ok) {
                    showNotification('Nutrition entry logged successfully!');
                    document.getElementById('nutrition-form').reset();
                    document.getElementById('nutrition-date').value = new Date().toISOString().split('T')[0];
                    loadNutritionEntries();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error logging nutrition entry', 'error');
            }
        }

        async function addMealPlan(e) {
            e.preventDefault();
            
            const startDate = new Date(document.getElementById('meal-plan-start').value);
            const endDate = new Date(startDate);
            endDate.setDate(endDate.getDate() + 6); // 7-day plan

            const mealPlanData = {
                userId: document.getElementById('meal-plan-user').value,
                name: document.getElementById('meal-plan-name').value,
                startDate: startDate.toISOString(),
                endDate: endDate.toISOString(),
                meals: [
                    { day: 'Monday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Tuesday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Wednesday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Thursday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Friday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Saturday', breakfast: [], lunch: [], dinner: [], snacks: [] },
                    { day: 'Sunday', breakfast: [], lunch: [], dinner: [], snacks: [] }
                ]
            };

            try {
                const response = await fetch('/api/meal-plans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mealPlanData)
                });

                if (response.ok) {
                    showNotification('Meal plan created successfully!');
                    document.getElementById('meal-plan-form').reset();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error creating meal plan', 'error');
            }
        }

        async function addUser(e) {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value,
                dietaryRestrictions: document.getElementById('user-restrictions').value.split(',').map(s => s.trim()).filter(s => s),
                allergies: document.getElementById('user-allergies').value.split(',').map(s => s.trim()).filter(s => s),
                nutritionGoals: {
                    dailyCalories: parseInt(document.getElementById('user-calories').value) || null,
                    protein: parseFloat(document.getElementById('user-protein').value) || null,
                    carbs: parseFloat(document.getElementById('user-carbs').value) || null,
                    fat: parseFloat(document.getElementById('user-fat').value) || null
                }
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    showNotification('User added successfully!');
                    document.getElementById('user-form').reset();
                    loadUsers();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding user', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
