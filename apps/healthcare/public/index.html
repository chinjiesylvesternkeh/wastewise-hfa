<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .stat-card {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e5e9;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .patient-list, .appointment-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .patient-item, .appointment-item {
            padding: 15px;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .patient-item:hover, .appointment-item:hover {
            background: #f8f9fa;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        .notification.error {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 Healthcare Management System</h1>
        <p>Comprehensive Patient Care Platform</p>
    </div>

    <div class="container">
        <!-- Dashboard Stats -->
        <div class="dashboard" id="dashboard">
            <div class="card stat-card">
                <h3>Total Patients</h3>
                <div class="stat-number" id="total-patients">0</div>
            </div>
            <div class="card stat-card">
                <h3>Today's Appointments</h3>
                <div class="stat-number" id="today-appointments">0</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('patients')">Patients</div>
            <div class="tab" onclick="switchTab('appointments')">Appointments</div>
            <div class="tab" onclick="switchTab('records')">Medical Records</div>
        </div>

        <!-- Patients Tab -->
        <div id="patients-tab" class="tab-content active">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Add New Patient</h3>
                    <form id="patient-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="patient-name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="patient-email" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="patient-phone">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="patient-dob">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="patient-gender">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Add Patient</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Recent Patients</h3>
                    <div class="patient-list" id="patient-list">
                        <!-- Patients will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Appointments Tab -->
        <div id="appointments-tab" class="tab-content">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Schedule Appointment</h3>
                    <form id="appointment-form">
                        <div class="form-group">
                            <label>Patient</label>
                            <select id="appointment-patient" required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Doctor Name</label>
                            <input type="text" id="appointment-doctor" required>
                        </div>
                        <div class="form-group">
                            <label>Appointment Date & Time</label>
                            <input type="datetime-local" id="appointment-date" required>
                        </div>
                        <div class="form-group">
                            <label>Reason</label>
                            <textarea id="appointment-reason" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn">Schedule Appointment</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Upcoming Appointments</h3>
                    <div class="appointment-list" id="appointment-list">
                        <!-- Appointments will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Medical Records Tab -->
        <div id="records-tab" class="tab-content">
            <div class="card">
                <h3>Add Medical Record</h3>
                <form id="record-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Patient</label>
                            <select id="record-patient" required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Visit Date</label>
                            <input type="date" id="record-date" required>
                        </div>
                        <div class="form-group">
                            <label>Diagnosis</label>
                            <input type="text" id="record-diagnosis">
                        </div>
                        <div class="form-group">
                            <label>Treatment</label>
                            <input type="text" id="record-treatment">
                        </div>
                        <div class="form-group">
                            <label>Blood Pressure</label>
                            <input type="text" id="record-bp" placeholder="120/80">
                        </div>
                        <div class="form-group">
                            <label>Heart Rate</label>
                            <input type="number" id="record-hr" placeholder="72">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="record-notes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn">Add Record</button>
                </form>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Global variables
        let patients = [];
        let appointments = [];

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            loadPatients();
            loadAppointments();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('patient-form').addEventListener('submit', addPatient);
            document.getElementById('appointment-form').addEventListener('submit', addAppointment);
            document.getElementById('record-form').addEventListener('submit', addMedicalRecord);
        }

        function switchTab(tabName) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab and content
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                document.getElementById('total-patients').textContent = data.totalPatients;
                document.getElementById('today-appointments').textContent = data.todayAppointments;
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function loadPatients() {
            try {
                const response = await fetch('/api/patients');
                patients = await response.json();
                
                displayPatients();
                populatePatientSelects();
            } catch (error) {
                console.error('Error loading patients:', error);
            }
        }

        function displayPatients() {
            const patientList = document.getElementById('patient-list');
            patientList.innerHTML = '';
            
            patients.slice(0, 10).forEach(patient => {
                const patientItem = document.createElement('div');
                patientItem.className = 'patient-item';
                patientItem.innerHTML = `
                    <div>
                        <strong>${patient.name}</strong><br>
                        <small>${patient.email}</small>
                    </div>
                    <div>
                        <small>${new Date(patient.createdAt).toLocaleDateString()}</small>
                    </div>
                `;
                patientList.appendChild(patientItem);
            });
        }

        function populatePatientSelects() {
            const selects = ['appointment-patient', 'record-patient'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = '<option value="">Select Patient</option>';
                patients.forEach(patient => {
                    const option = document.createElement('option');
                    option.value = patient._id;
                    option.textContent = patient.name;
                    select.appendChild(option);
                });
            });
        }

        async function addPatient(e) {
            e.preventDefault();
            
            const patientData = {
                name: document.getElementById('patient-name').value,
                email: document.getElementById('patient-email').value,
                phone: document.getElementById('patient-phone').value,
                dateOfBirth: document.getElementById('patient-dob').value,
                gender: document.getElementById('patient-gender').value
            };

            try {
                const response = await fetch('/api/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patientData)
                });

                if (response.ok) {
                    showNotification('Patient added successfully!');
                    document.getElementById('patient-form').reset();
                    loadPatients();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding patient', 'error');
            }
        }

        async function loadAppointments() {
            try {
                const response = await fetch('/api/appointments');
                appointments = await response.json();
                displayAppointments();
            } catch (error) {
                console.error('Error loading appointments:', error);
            }
        }

        function displayAppointments() {
            const appointmentList = document.getElementById('appointment-list');
            appointmentList.innerHTML = '';
            
            appointments.slice(0, 10).forEach(appointment => {
                const appointmentItem = document.createElement('div');
                appointmentItem.className = 'appointment-item';
                appointmentItem.innerHTML = `
                    <div>
                        <strong>${appointment.patientId?.name || 'Unknown Patient'}</strong><br>
                        <small>Dr. ${appointment.doctorName}</small>
                    </div>
                    <div>
                        <small>${new Date(appointment.appointmentDate).toLocaleString()}</small>
                    </div>
                `;
                appointmentList.appendChild(appointmentItem);
            });
        }

        async function addAppointment(e) {
            e.preventDefault();
            
            const appointmentData = {
                patientId: document.getElementById('appointment-patient').value,
                doctorName: document.getElementById('appointment-doctor').value,
                appointmentDate: document.getElementById('appointment-date').value,
                reason: document.getElementById('appointment-reason').value
            };

            try {
                const response = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appointmentData)
                });

                if (response.ok) {
                    showNotification('Appointment scheduled successfully!');
                    document.getElementById('appointment-form').reset();
                    loadAppointments();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error scheduling appointment', 'error');
            }
        }

        async function addMedicalRecord(e) {
            e.preventDefault();
            
            const recordData = {
                patientId: document.getElementById('record-patient').value,
                visitDate: document.getElementById('record-date').value,
                diagnosis: document.getElementById('record-diagnosis').value,
                treatment: document.getElementById('record-treatment').value,
                vitals: {
                    bloodPressure: document.getElementById('record-bp').value,
                    heartRate: parseInt(document.getElementById('record-hr').value) || null
                },
                notes: document.getElementById('record-notes').value
            };

            try {
                const response = await fetch('/api/medical-records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recordData)
                });

                if (response.ok) {
                    showNotification('Medical record added successfully!');
                    document.getElementById('record-form').reset();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding medical record', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
