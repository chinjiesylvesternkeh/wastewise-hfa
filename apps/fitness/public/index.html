<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        .stat-card {
            text-align: center;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e5e9;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
        }

        .tab.active {
            border-bottom-color: #ff6b6b;
            color: #ff6b6b;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .workout-list, .goal-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .workout-item, .goal-item {
            padding: 15px;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workout-item:hover, .goal-item:hover {
            background: #f8f9fa;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e1e5e9;
            border-radius: 5px;
            overflow: hidden;
            margin: 5px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            transition: width 0.3s ease;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        .notification.error {
            background: #f44336;
        }

        .exercise-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💪 Fitness Tracker</h1>
        <p>Track Your Fitness Journey</p>
    </div>

    <div class="container">
        <!-- Dashboard Stats -->
        <div class="dashboard" id="dashboard">
            <div class="card stat-card">
                <h3>Total Users</h3>
                <div class="stat-number" id="total-users">0</div>
            </div>
            <div class="card stat-card">
                <h3>Total Workouts</h3>
                <div class="stat-number" id="total-workouts">0</div>
            </div>
            <div class="card stat-card">
                <h3>Active Goals</h3>
                <div class="stat-number" id="active-goals">0</div>
            </div>
            <div class="card stat-card">
                <h3>Today's Workouts</h3>
                <div class="stat-number" id="today-workouts">0</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('workouts')">Workouts</div>
            <div class="tab" onclick="switchTab('goals')">Goals</div>
            <div class="tab" onclick="switchTab('progress')">Progress</div>
            <div class="tab" onclick="switchTab('users')">Users</div>
        </div>

        <!-- Workouts Tab -->
        <div id="workouts-tab" class="tab-content active">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Log Workout</h3>
                    <form id="workout-form">
                        <div class="form-group">
                            <label>User</label>
                            <select id="workout-user" required>
                                <option value="">Select User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Workout Name</label>
                            <input type="text" id="workout-name" required placeholder="e.g., Morning Run">
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="workout-type" required>
                                <option value="">Select Type</option>
                                <option value="cardio">Cardio</option>
                                <option value="strength">Strength Training</option>
                                <option value="flexibility">Flexibility</option>
                                <option value="sports">Sports</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Duration (minutes)</label>
                            <input type="number" id="workout-duration" required>
                        </div>
                        <div class="form-group">
                            <label>Calories Burned</label>
                            <input type="number" id="workout-calories">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="workout-date" required>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea id="workout-notes" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn">Log Workout</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Recent Workouts</h3>
                    <div class="workout-list" id="workout-list">
                        <!-- Workouts will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Goals Tab -->
        <div id="goals-tab" class="tab-content">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>Set New Goal</h3>
                    <form id="goal-form">
                        <div class="form-group">
                            <label>User</label>
                            <select id="goal-user" required>
                                <option value="">Select User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Goal Type</label>
                            <select id="goal-type" required>
                                <option value="">Select Type</option>
                                <option value="weight_loss">Weight Loss</option>
                                <option value="muscle_gain">Muscle Gain</option>
                                <option value="endurance">Endurance</option>
                                <option value="strength">Strength</option>
                                <option value="flexibility">Flexibility</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Target Value</label>
                            <input type="number" id="goal-target" required step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Current Value</label>
                            <input type="number" id="goal-current" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Unit</label>
                            <input type="text" id="goal-unit" placeholder="kg, lbs, minutes, etc.">
                        </div>
                        <div class="form-group">
                            <label>Deadline</label>
                            <input type="date" id="goal-deadline">
                        </div>
                        <button type="submit" class="btn">Set Goal</button>
                    </form>
                </div>
                <div class="card">
                    <h3>Active Goals</h3>
                    <div class="goal-list" id="goal-list">
                        <!-- Goals will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Tab -->
        <div id="progress-tab" class="tab-content">
            <div class="card">
                <h3>Log Progress</h3>
                <form id="progress-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>User</label>
                            <select id="progress-user" required>
                                <option value="">Select User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="progress-date" required>
                        </div>
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" id="progress-weight" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Body Fat (%)</label>
                            <input type="number" id="progress-bodyfat" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Chest (cm)</label>
                            <input type="number" id="progress-chest" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Waist (cm)</label>
                            <input type="number" id="progress-waist" step="0.1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="progress-notes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn">Log Progress</button>
                </form>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="users-tab" class="tab-content">
            <div class="card">
                <h3>Add New User</h3>
                <form id="user-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="user-name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="user-email" required>
                        </div>
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" id="user-age">
                        </div>
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" id="user-weight" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Height (cm)</label>
                            <input type="number" id="user-height">
                        </div>
                        <div class="form-group">
                            <label>Fitness Goal</label>
                            <select id="user-goal">
                                <option value="">Select Goal</option>
                                <option value="weight_loss">Weight Loss</option>
                                <option value="muscle_gain">Muscle Gain</option>
                                <option value="endurance">Endurance</option>
                                <option value="general_fitness">General Fitness</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn">Add User</button>
                </form>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Global variables
        let users = [];
        let workouts = [];
        let goals = [];

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            loadUsers();
            loadWorkouts();
            loadGoals();
            setupEventListeners();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('workout-date').value = today;
            document.getElementById('progress-date').value = today;
        });

        function setupEventListeners() {
            document.getElementById('workout-form').addEventListener('submit', addWorkout);
            document.getElementById('goal-form').addEventListener('submit', addGoal);
            document.getElementById('progress-form').addEventListener('submit', addProgress);
            document.getElementById('user-form').addEventListener('submit', addUser);
        }

        function switchTab(tabName) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab and content
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                document.getElementById('total-users').textContent = data.totalUsers;
                document.getElementById('total-workouts').textContent = data.totalWorkouts;
                document.getElementById('active-goals').textContent = data.activeGoals;
                document.getElementById('today-workouts').textContent = data.todayWorkouts;
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                users = await response.json();
                populateUserSelects();
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function populateUserSelects() {
            const selects = ['workout-user', 'goal-user', 'progress-user'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = '<option value="">Select User</option>';
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user._id;
                    option.textContent = user.name;
                    select.appendChild(option);
                });
            });
        }

        async function loadWorkouts() {
            try {
                const response = await fetch('/api/workouts');
                workouts = await response.json();
                displayWorkouts();
            } catch (error) {
                console.error('Error loading workouts:', error);
            }
        }

        function displayWorkouts() {
            const workoutList = document.getElementById('workout-list');
            workoutList.innerHTML = '';
            
            workouts.slice(0, 10).forEach(workout => {
                const workoutItem = document.createElement('div');
                workoutItem.className = 'workout-item';
                workoutItem.innerHTML = `
                    <div>
                        <strong>${workout.name}</strong><br>
                        <small>${workout.type} • ${workout.duration} min</small><br>
                        <small>${workout.userId?.name || 'Unknown User'}</small>
                    </div>
                    <div>
                        <div>${workout.caloriesBurned || 0} cal</div>
                        <small>${new Date(workout.date).toLocaleDateString()}</small>
                    </div>
                `;
                workoutList.appendChild(workoutItem);
            });
        }

        async function addWorkout(e) {
            e.preventDefault();
            
            const workoutData = {
                userId: document.getElementById('workout-user').value,
                name: document.getElementById('workout-name').value,
                type: document.getElementById('workout-type').value,
                duration: parseInt(document.getElementById('workout-duration').value),
                caloriesBurned: parseInt(document.getElementById('workout-calories').value) || 0,
                date: document.getElementById('workout-date').value,
                notes: document.getElementById('workout-notes').value
            };

            try {
                const response = await fetch('/api/workouts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workoutData)
                });

                if (response.ok) {
                    showNotification('Workout logged successfully!');
                    document.getElementById('workout-form').reset();
                    document.getElementById('workout-date').value = new Date().toISOString().split('T')[0];
                    loadWorkouts();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error logging workout', 'error');
            }
        }

        async function loadGoals() {
            try {
                const response = await fetch('/api/goals');
                goals = await response.json();
                displayGoals();
            } catch (error) {
                console.error('Error loading goals:', error);
            }
        }

        function displayGoals() {
            const goalList = document.getElementById('goal-list');
            goalList.innerHTML = '';
            
            goals.slice(0, 10).forEach(goal => {
                const progress = goal.target > 0 ? (goal.current / goal.target) * 100 : 0;
                const goalItem = document.createElement('div');
                goalItem.className = 'goal-item';
                goalItem.innerHTML = `
                    <div style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong>${goal.type.replace('_', ' ').toUpperCase()}</strong>
                            <span>${goal.current}/${goal.target} ${goal.unit || ''}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
                        </div>
                        <small>${goal.userId?.name || 'Unknown User'} • ${goal.status}</small>
                    </div>
                `;
                goalList.appendChild(goalItem);
            });
        }

        async function addGoal(e) {
            e.preventDefault();
            
            const goalData = {
                userId: document.getElementById('goal-user').value,
                type: document.getElementById('goal-type').value,
                target: parseFloat(document.getElementById('goal-target').value),
                current: parseFloat(document.getElementById('goal-current').value) || 0,
                unit: document.getElementById('goal-unit').value,
                deadline: document.getElementById('goal-deadline').value
            };

            try {
                const response = await fetch('/api/goals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(goalData)
                });

                if (response.ok) {
                    showNotification('Goal set successfully!');
                    document.getElementById('goal-form').reset();
                    loadGoals();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error setting goal', 'error');
            }
        }

        async function addProgress(e) {
            e.preventDefault();
            
            const progressData = {
                userId: document.getElementById('progress-user').value,
                date: document.getElementById('progress-date').value,
                weight: parseFloat(document.getElementById('progress-weight').value) || null,
                bodyFat: parseFloat(document.getElementById('progress-bodyfat').value) || null,
                measurements: {
                    chest: parseFloat(document.getElementById('progress-chest').value) || null,
                    waist: parseFloat(document.getElementById('progress-waist').value) || null
                },
                notes: document.getElementById('progress-notes').value
            };

            try {
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(progressData)
                });

                if (response.ok) {
                    showNotification('Progress logged successfully!');
                    document.getElementById('progress-form').reset();
                    document.getElementById('progress-date').value = new Date().toISOString().split('T')[0];
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error logging progress', 'error');
            }
        }

        async function addUser(e) {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value,
                age: parseInt(document.getElementById('user-age').value) || null,
                weight: parseFloat(document.getElementById('user-weight').value) || null,
                height: parseInt(document.getElementById('user-height').value) || null,
                fitnessGoal: document.getElementById('user-goal').value
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    showNotification('User added successfully!');
                    document.getElementById('user-form').reset();
                    loadUsers();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showNotification(error.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding user', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
